name: Build Backend and Frontend

on:
  pull_request:
    branches:
      - main
      
permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - SampleApp/BackEnd/BackEnd.csproj
          - SampleApp/FrontEnd/FrontEnd.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SampleApp/BackEnd.Tests/BackEnd.Tests.csproj

      - name: Build test project
        run: dotnet build SampleApp/BackEnd.Tests/BackEnd.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test SampleApp/BackEnd.Tests/BackEnd.Tests.csproj --no-build --configuration Release --verbosity normal